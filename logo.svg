<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
    <defs>
        <radialGradient id="logoFace" cx="50%" cy="35%" r="80%">
            <stop offset="0%" stop-color="#334155"/>
            <stop offset="100%" stop-color="#0f172a"/>
        </radialGradient>
    </defs>

    <!-- Clock face & ring -->
    <circle cx="32" cy="32" r="29" fill="url(#logoFace)"/>
    <circle cx="32" cy="32" r="29" fill="none" stroke="#38bdf8" stroke-opacity="0.55" stroke-width="2"/>

    <!-- Cardinal ticks -->
    <g stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round">
        <line x1="32" y1="6.5" x2="32" y2="12"/>
        <line x1="57.5" y1="32" x2="52" y2="32"/>
        <line x1="32" y1="57.5" x2="32" y2="52"/>
        <line x1="6.5" y1="32" x2="12" y2="32"/>
    </g>

    <!-- Hands at 10:10 -->
    <line x1="32" y1="32" x2="20.7" y2="25.5" stroke="#f8fafc" stroke-width="4" stroke-linecap="round"/>
    <line x1="32" y1="32" x2="44.1" y2="25" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <line x1="32" y1="32" x2="32" y2="13" stroke="#f43f5e" stroke-width="1.75" stroke-linecap="round"/>

    <!-- Center cap -->
    <circle cx="32" cy="32" r="3.5" fill="#f43f5e"/>
    <circle cx="32" cy="32" r="1.4" fill="#f8fafc"/>
</svg>
